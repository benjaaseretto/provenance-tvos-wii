# App vacía con el bundle ID de Provenance: compilarla hace que Xcode emita el perfil gratis.
# Las variables salen de config.env (scripts/config.sh las exporta).
name: Stub
targets:
  Stub:
    type: application
    platform: tvOS
    deploymentTarget: "17.6"
    sources: [Stub]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.provenance
      DEVELOPMENT_TEAM: ${TEAM_ID}
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
